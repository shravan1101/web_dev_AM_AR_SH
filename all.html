<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Controls</title>

  <style>
    /* container */
    .songbutton {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* Previous & Next buttons */
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      fill: #b3b3b3;
      transition: fill 0.2s ease, transform 0.2s ease;
    }

    .icon-btn:hover svg {
      fill: #ffffff;
      transform: scale(1.08);
    }

    .icon-btn:active svg {
      transform: scale(0.95);
    }

    /* Play button */
    .play-btn {
      width: 48px;
      height: 48px;
      background: #ffffff;
      border: none;
      border-radius: 50%;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .play-btn svg {
      width: 22px;
      height: 22px;
      fill: #000000;
      margin-left: 2px; /* optical centering */
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .play-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <div class="songbutton">

    <!-- Previous -->
    <button class="icon-btn" aria-label="Previous">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7z"/>
      </svg>
    </button>

    <!-- Play -->
    <button class="play-btn" aria-label="Play">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 1.7a.7.7 0 0 1 1.05-.6l10.9 6.3a.7.7 0 0 1 0 1.2L4.05 14.9A.7.7 0 0 1 3 14.3z"/>
      </svg>
    </button>

    <!-- Next -->
    <button class="icon-btn" aria-label="Next">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7z"/>
      </svg>
    </button>

  </div>

</body>
</html>
