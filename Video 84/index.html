      <div class="right bg-gray roundded" style="margin: 19px">
        <div class="header">
          <div class="nav">
            <img src="hamburger.svg" alt="hamburger" class="hamburger invert">
            <svg
              class="invert"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
            >
              <path
                d="M15.293 3.293 6.586 12l8.707 8.707 1.414-1.414L9.414 12l7.293-7.293-1.414-1.414z"
              />
            </svg>

            <svg
              class="invert"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
            >
              <path
                d="M7.293 4.707 14.586 12l-7.293 7.293 1.414 1.414L17.414 12 8.707 3.293 7.293 4.707z"
              />
            </svg>
          </div>

          <div class="button">
            <button class="signupbtn">Log in</button>
            <button class="loginbtn">sign up</button>
          </div>
        </div>

        <div class="spotifyplaylist">
          <h1>Spotify Playlist</h1>

          <div class="cardcontainer">
            <div class="card">
              <div class="play toggle">
                <svg
                  width="56"
                  height="56"
                  viewBox="0 0 56 56"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <circle cx="28" cy="28" r="22" fill="#1DB954" />
                  <path d="M23 17 L23 39 L39 28 Z" fill="#000000" />
                </svg>
              </div>

              <img
                src="https://pickasso.spotifycdn.com/image/ab67c0de0000deef/dt/v1/img/thisisv3/3z97WMRi731dCvKklIf2X6/en-GB"
                alt="l-like-me-better"
              />

              <h2>This Is NEFFEX</h2>

              <p style="font-size: 16px">
                This is NEFFEX. The essential tracks, all in one playlist.
              </p>
            </div>

            <div class="card">
              <div class="play toggle">
                <svg
                  width="56"
                  height="56"
                  viewBox="0 0 56 56"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <circle cx="28" cy="28" r="22" fill="#1DB954" />
                  <path d="M23 17 L23 39 L39 28 Z" fill="#000000" />
                </svg>
              </div>

              <img
                src="https://pickasso.spotifycdn.com/image/ab67c0de0000deef/dt/v1/img/thisisv3/3z97WMRi731dCvKklIf2X6/en-GB"
                alt="l-like-me-better"
              />

              <h2>This Is NEFFEX</h2>

              <p style="font-size: 16px">
                This is NEFFEX. The essential tracks, all in one playlist.
              </p>
            </div>
          </div>

          <div class="playbar">
            <div class="main-bar">
              <div class="songinfo"></div>

              <div class="all-songbutton">
                <button
                  id="previous"
                  class="all-icon-btn"
                  aria-label="Previous"
                >
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7z"
                    />
                  </svg>
                </button>

                <button id="play" class="all-play-btn" aria-label="Play/Pause">
                  <img
                    src="play.svg"
                    alt="play/pause"
                    class="play-toggle-icon"
                  />
                </button>

                <button id="next" class="all-icon-btn" aria-label="Next">
                  <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7z"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <div class="progress-row">
              <div class="seekbar">
                <div class="circle"></div>
              </div>
              <div class="songtime"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
