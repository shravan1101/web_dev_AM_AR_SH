<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="utility.css" />
    <link
      rel="stylesheet"
      href="https://sets.hugeicons.com/YOUR-SET-ID.css"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container flex bg-black">
      <div class="left">
        <div class="home bg-gray roundded m-1 p-1">
          <div class="logo flex">
            <ul>
              <li>
                <img src="logo.svg" class="invert" alt="logo" />
              </li>
              <li>soptify</li>
            </ul>
          </div>

          <ul>
            <li>
              <img src="home.svg" class="invert" alt="home" />
              home
            </li>
            <li>
              <img src="search.svg" class="invert" alt="search" />
              search
            </li>
          </ul>
        </div>

        <div class="library bg-gray m-1">
          <div class="heading">
            <img src="library.svg" class="invert" alt="library" />
            <h2>your library</h2>
          </div>

          <div class="footer">
            <div>
              <a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a>
            </div>
            <div>
              <a href="https://www.spotify.com/jp/privacy/"
                ><span>Privacy Center</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/"
                ><span>Privacy Policy</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/cookies-policy/"
                ><span>Cookies</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"
                ><span>About Ads</span></a
              >
            </div>
            <div>
              <a href="https://www.spotify.com/jp/accessibility/"
                ><span>Accessibility</span></a
              >
            </div>
          </div>
        </div>
      </div>

      <div class="right bg-gray roundded" style="margin: 19px">›
        <div class="header">
          <div class="nav">
            <svg
              class="invert"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
            >
              <path
                d="M15.293 3.293 6.586 12l8.707 8.707 1.414-1.414L9.414 12l7.293-7.293-1.414-1.414z"
              />
            </svg>
            <svg
              class="invert"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
            >
              <path
                d="M7.293 4.707 14.586 12l-7.293 7.293 1.414 1.414L17.414 12 8.707 3.293 7.293 4.707z"
              />
            </svg>
          </div>
          <div class="button">
            <button>Log in</button>
            <button>sign up</button>
          </div>
        </div>
        <div class="spotifyplaylist">
          <h1>Spotify Playlist</h1>
          <div class="cardcontainer">
            <div class="card">
              <div class="play toggle">
                <svg
                  width="56"
                  height="56"
                  viewBox="0 0 56 56"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <!-- Green circle -->
                  <circle cx="28" cy="28" r="22" fill="#1DB954" />

                  <!-- Play triangle -->
                  <path d="M23 17 L23 39 L39 28 Z" fill="#000000" />
                </svg>
              </div>
              <img
                src="https://pickasso.spotifycdn.com/image/ab67c0de0000deef/dt/v1/img/thisisv3/3z97WMRi731dCvKklIf2X6/en-GB"
                alt="l-like-me-better"
              />
              <h2>This Is NEFFEX</h2>
              <p style="font-size: 16px">
                This is NEFFEX. The essential tracks, all in one playlist.
              </p>
            </div>
            <div class="card">
              <img
                src="https://pickasso.spotifycdn.com/image/ab67c0de0000deef/dt/v1/img/thisisv3/3z97WMRi731dCvKklIf2X6/en-GB"
                alt="l-like-me-better"
              />
              <h2>This Is NEFFEX</h2>
              <p style="font-size: 16px">
                This is NEFFEX. The essential tracks, all in one playlist.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
