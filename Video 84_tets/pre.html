<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
       
      .play-btn {
        width: 48px;
        height: 48px;
        background: #ffffff;
        border: none;
        border-radius: 50%;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .play-btn svg {
        width: 22px;
        height: 22px;
        fill: #000000;
        margin-left: 2px; /* optical centering */
      }

      .play-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      }

      .play-btn:active {
        transform: scale(0.96);
      }

      .play-btn:focus-visible {
        outline: 2px solid #1db954;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <button class="play-btn" aria-label="Play">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M3 1.7a.7.7 0 0 1 1.05-.6l10.9 6.3a.7.7 0 0 1 0 1.2L4.05 14.9A.7.7 0 0 1 3 14.3z"
        />
      </svg>
    </button>
  </body>
</html>
