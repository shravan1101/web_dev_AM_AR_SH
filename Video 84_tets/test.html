<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Play Button</title>

  <style>
    body {
      background: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .spotify-play {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;

      background: #1db954; /* Spotify green */
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .spotify-play:hover {
      transform: scale(1.1);
      background: #1ed760;
    }

    .spotify-play svg {
      width: 20px;
      height: 20px;
      fill: #000;
      margin-left: 2px; /* Spotify triangle offset */
    }
  </style>
</head>

<body>
  <button class="spotify-play" aria-label="Play">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 5v14l11-7z"></path>
    </svg>
  </button>
</body>
</html>
